<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overview - VitalDrop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
</head>
<body>
    <div id="navbarSlot"></div>

    <main class="container py-4">
        <section class="ledger-hero">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
                <div>
                    <div class="ledger-panel-label" style="color:#E8C86A;">Blood-network overview</div>
                    <h1 class="mb-1" id="greeting">Welcome</h1>
                    <p class="mb-0" id="userLine">Your dashboard</p>
                </div>
                <div class="d-flex flex-wrap gap-2 align-items-center">
                    <div class="form-check form-switch d-none" id="availToggleWrap">
                        <input class="form-check-input" type="checkbox" role="switch" id="availToggle">
                        <label class="form-check-label" for="availToggle" id="availLabel">Available</label>
                    </div>
                    <button class="btn btn-light fw-bold" id="newRequestBtn">
                        <i class="bi bi-send-plus-fill me-1"></i>New Assistance Request
                    </button>
                </div>
            </div>
        </section>

        <div class="reminder-banner d-none mb-4" id="reminderBanner">
            <i class="bi bi-exclamation-octagon-fill fs-4"></i>
            <div>
                It has been more than 90 days since your last blood contribution.
                <a href="profile.html" class="text-white text-decoration-underline fw-bold">Update your status</a>.
            </div>
        </div>

        <div class="ledger-grid ledger-grid-2 mb-4">
            <div class="card-lifelink p-3 p-md-4">
                <div class="ledger-panel-label"><span class="icon-badge"><i class="bi bi-search-heart"></i></span>Find blood donators</div>
                <form id="homeSearchForm">
                    <div class="row g-2 align-items-end">
                        <div class="col-md-5">
                            <label class="form-label">Blood Group</label>
                            <select class="form-select" id="homeBloodGroup">
                                <option value="">All blood groups</option>
                                <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
                                <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Locality</label>
                            <div class="input-group">
                                <button class="btn btn-lifelink-soft" type="button" id="homeLocateBtn"><i class="bi bi-geo-alt-fill"></i></button>
                                <input class="form-control" id="homeLocText" placeholder="Your location" readonly>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <button type="submit" class="btn btn-ledger-send w-100" id="homeSearchBtn">
                                <i class="bi bi-search-heart me-1"></i>Search Donators
                            </button>
                        </div>
                    </div>
                </form>
            </div>
            <div class="card-lifelink p-3 p-md-4 h-100">
                <div class="ledger-panel-label"><span class="icon-badge slate"><i class="bi bi-grid-fill"></i></span>Quick actions</div>
                <div class="d-grid gap-2">
                    <a href="request.html" class="btn btn-lifelink-soft text-start"><i class="bi bi-send-fill me-2"></i>My assistance requests</a>
                    <a href="search.html" class="btn btn-lifelink-soft text-start"><i class="bi bi-person-hearts me-2"></i>Browse donators</a>
                    <a href="history.html" class="btn btn-lifelink-soft text-start"><i class="bi bi-journal-check me-2"></i>Contribution history</a>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h5 fw-bold mb-0"><span class="icon-badge"><i class="bi bi-person-hearts"></i></span>Nearby Donators</h2>
            <span class="text-muted small" id="homeResultInfo"></span>
        </div>
        <div class="row g-3" id="donorGrid"></div>
        <div class="mt-4" id="homePagination"></div>
    </main>

    <footer class="site-footer text-center">
        <div class="container">
            <p class="mb-0 small">VitalDrop - Every Drop is Vital</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
    <script src="js/donors.js"></script>
    <script src="js/request.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
