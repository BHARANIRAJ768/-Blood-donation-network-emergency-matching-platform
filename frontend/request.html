<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Assistance Requests - VitalDrop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
</head>
<body>
    <div id="navbarSlot"></div>

    <main class="container py-4">
        <section class="ledger-hero">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
                <div>
                    <div class="ledger-panel-label" style="color:#E8C86A;"><i class="bi bi-send-fill me-1"></i>Assistance ledger</div>
                    <h1 class="mb-1">Blood Assistance Requests</h1>
                    <p class="mb-0">Track your own appeals and respond to open calls for help.</p>
                </div>
                <button class="btn btn-light fw-bold" id="newRequestBtn">
                    <i class="bi bi-send-plus-fill me-1"></i>Request Assistance
                </button>
            </div>
        </section>

        <ul class="nav nav-tabs mb-4" id="requestTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="myTab" data-bs-toggle="tab" data-bs-target="#myPane" type="button" role="tab">
                    <i class="bi bi-journal-check me-1"></i>My Assistance Requests
                </button>
            </li>
            <li class="nav-item" role="presentation" id="availableTabWrap">
                <button class="nav-link" id="availableTab" data-bs-toggle="tab" data-bs-target="#availablePane" type="button" role="tab">
                    <i class="bi bi-inbox-fill me-1"></i>Open Calls For Me
                </button>
            </li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="myPane" role="tabpanel">
                <div id="myRequestsList"></div>
            </div>
            <div class="tab-pane fade" id="availablePane" role="tabpanel">
                <div id="availableRequestsList"></div>
            </div>
        </div>
    </main>

    <footer class="site-footer text-center">
        <div class="container">
            <p class="mb-0 small">VitalDrop - Every Drop is Vital</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
    <script src="js/request.js"></script>
    <script src="js/requests.js"></script>
</body>
</html>
