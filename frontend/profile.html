<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - VitalDrop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
</head>
<body>
    <div id="navbarSlot"></div>

    <main class="container container-tight py-4">
        <section class="ledger-hero">
            <div class="ledger-panel-label" style="color:#E8C86A;"><i class="bi bi-person-vcard-fill me-1"></i>Member file</div>
            <h1 class="mb-1">My Profile</h1>
            <p class="mb-0">Your identity, blood group, locality and readiness — all in one place.</p>
        </section>

        <div class="card-lifelink p-4 p-md-5 mb-4 animate-in">
            <div class="ledger-panel-label"><span class="icon-badge"><i class="bi bi-pencil-square"></i></span>Revise member details</div>
            <div class="text-center mb-4">
                <div class="position-relative d-inline-block">
                    <div id="photoPreview" class="profile-photo-lg d-flex align-items-center justify-content-center fw-bold fs-1 text-danger-700">
                        <i class="bi bi-person-vcard"></i>
                    </div>
                    <button class="btn btn-ledger-slate btn-sm position-absolute bottom-0 end-0 rounded-circle"
                        id="photoBtn" title="Change photo"><i class="bi bi-image-fill"></i></button>
                    <input type="file" id="photoInput" accept="image/png,image/jpeg,image/jpg,image/webp,image/gif" hidden>
                </div>
                <div class="mt-2">
                    <span class="role-badge role-ADMIN" id="roleBadge"></span>
                    <span class="bg-chip ms-1" id="profileGroupChip"></span>
                </div>
                <p class="text-muted mb-0 mt-2" id="profileEmail"></p>
            </div>

            <form id="profileForm" novalidate>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="pName">Full Name</label>
                        <input type="text" class="form-control" id="pName" required maxlength="120">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="pPhone">Phone Number</label>
                        <input type="tel" class="form-control" id="pPhone" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="pBloodGroup">Blood Group</label>
                        <select class="form-select" id="pBloodGroup">
                            <option value="">Select</option>
                            <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
                            <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
                        </select>
                    </div>
                    <div class="col-md-6 d-flex align-items-end">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" role="switch" id="pAvailable">
                            <label class="form-check-label" for="pAvailable" id="pAvailableLabel">Ready to contribute</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="pDistrict">District / Locality</label>
                        <input type="text" class="form-control" id="pDistrict" placeholder="Where can you reach in time?">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Pinned Locality</label>
                        <div class="d-flex flex-wrap gap-2">
                             <button type="button" class="btn btn-lifelink-soft btn-sm" id="pLocateBtn">
                                <i class="bi bi-geo-alt-fill me-1"></i>Pin my current locality
                            </button>
                            <span class="align-self-center small text-muted" id="pLocStatus">Location not set</span>
                        </div>
                        <input type="hidden" id="pLatitude">
                        <input type="hidden" id="pLongitude">
                    </div>
                </div>
                <button type="submit" class="btn btn-ledger-primary w-100 py-2 mt-4">
                    <span class="inline-loader" id="profileLoader"></span>
                    <span id="profileBtnText"><i class="bi bi-check2-square me-2"></i>Save Changes</span>
                </button>
            </form>
        </div>

        <div class="card-lifelink p-4 p-md-5 animate-in">
            <div class="ledger-panel-label"><span class="icon-badge slate"><i class="bi bi-key-fill"></i></span>Rotate sign-in secret</div>
            <h2 class="h5 fw-bold mb-3">Change Password</h2>
            <form id="passwordForm" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="currentPassword">Current Password</label>
                    <input type="password" class="form-control" id="currentPassword" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="newPassword">New Password <span class="text-muted small">(min 8 chars)</span></label>
                    <input type="password" class="form-control" id="newPassword" required minlength="8">
                </div>
                <div class="mb-4">
                    <label class="form-label" for="confirmNewPassword">Confirm New Password</label>
                    <input type="password" class="form-control" id="confirmNewPassword" required>
                </div>
                <button type="submit" class="btn btn-outline-danger w-100">
                    <span class="inline-loader" id="pwLoader"></span>
                    <span id="pwBtnText"><i class="bi bi-key-fill me-2"></i>Update Password</span>
                </button>
            </form>
        </div>
    </main>

    <footer class="site-footer text-center">
        <div class="container">
            <p class="mb-0 small">VitalDrop - Every Drop is Vital</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
