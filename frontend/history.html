<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contribution History - VitalDrop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
</head>
<body>
    <div id="navbarSlot"></div>

    <main class="container py-4">
        <section class="ledger-hero">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
                <div>
                    <div class="ledger-panel-label" style="color:#E8C86A;"><i class="bi bi-activity me-1"></i>Contribution ledger</div>
                    <h1 class="mb-1">Blood Contribution History</h1>
                    <p class="mb-0">Every appeal and completed blood contribution, recorded for good.</p>
                </div>
                <button class="btn btn-light fw-bold" id="exportPdfBtn">
                    <i class="bi bi-filetype-pdf me-1"></i>Export PDF
                </button>
            </div>
        </section>

        <div class="card-lifelink p-3 mb-4">
            <div class="ledger-panel-label"><span class="icon-badge slate"><i class="bi bi-funnel-fill"></i></span>Filter the ledger</div>
            <div class="row g-2 align-items-end">
                <div class="col-md-4">
                    <label class="form-label">Standing</label>
                    <select class="form-select" id="historyStatus">
                        <option value="">All standings</option>
                        <option>PENDING</option>
                        <option>ACCEPTED</option>
                        <option>COMPLETED</option>
                        <option>REJECTED</option>
                        <option>CANCELLED</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Look up</label>
                    <input type="text" class="form-control" id="historySearch" placeholder="Look up patient, donator, care centre, blood group...">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-ledger-slate w-100" id="historySearchBtn"><i class="bi bi-funnel-fill me-1"></i>Apply</button>
                </div>
            </div>
        </div>

        <div class="card-lifelink p-0 overflow-hidden">
            <div class="table-responsive table-responsive-lg-sm">
                <table class="table table-lifelink align-middle">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Blood Group</th>
                            <th>Patient</th>
                            <th>Donator</th>
                            <th>Care Centre</th>
                            <th>Standing</th>
                            <th>My Part</th>
                        </tr>
                    </thead>
                    <tbody id="historyBody"></tbody>
                </table>
            </div>
        </div>
        <div class="mt-4" id="historyPagination"></div>
    </main>

    <footer class="site-footer text-center">
        <div class="container">
            <p class="mb-0 small">VitalDrop - Every Drop is Vital</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
    <script src="js/donors.js"></script>
    <script src="js/history.js"></script>
</body>
</html>
