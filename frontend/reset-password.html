<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password - VitalDrop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
</head>
<body class="d-flex align-items-center" style="min-height:100vh;">
    <div class="container container-tight py-4">
        <div class="text-center mb-4">
            <a class="navbar-brand text-danger-700 fs-2 fw-bold d-inline-flex align-items-center gap-2" href="index.html"><span class="brand-mark"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 50C24 42.5 17.5 36.4 17.5 29.6c0-5.4 4-9.3 9-9.3 2.8 0 4.9 1.4 5.5 2.1 0.6-0.7 2.7-2.1 5.5-2.1 5 0 9 3.9 9 9.3 0 6.8-6.5 12.9-14.5 20.4z" fill="#FFF7EA"/><path d="M32 42.5c-4.6-4-7.8-6.9-7.8-10.1 0-2.4 1.8-4.1 4-4.1 1.4 0 2.6 0.7 3.8 2 1.2-1.3 2.4-2 3.8-2 2.2 0 4 1.7 4 4.1 0 3.2-3.2 6.1-7.8 10.1z" fill="#D90429"/></svg></span> VitalDrop</a>
        </div>

        <div class="card-lifelink p-4 p-md-5 animate-in">
            <h1 class="h3 fw-bold mb-1">Set a new password</h1>
            <p class="text-muted mb-4">Choose a new password for your account.</p>

            <form id="resetForm" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="newPassword">New Password</label>
                    <input type="password" class="form-control" id="newPassword" placeholder="Min 8 characters" required minlength="8">
                    <div class="invalid-feedback">Password must be at least 8 characters.</div>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="confirmNewPassword">Confirm New Password</label>
                    <input type="password" class="form-control" id="confirmNewPassword" placeholder="Repeat password" required>
                    <div class="invalid-feedback">Passwords do not match.</div>
                </div>

                <button type="submit" class="btn btn-lifelink w-100 py-2">
                    <span class="inline-loader" id="resetLoader"></span>
                    <span id="resetText"><i class="bi bi-check-circle me-2"></i>Update password</span>
                </button>
            </form>

            <div class="text-center mt-4">
                <a href="login.html" class="fw-bold"><i class="bi bi-arrow-left me-1"></i>Back to login</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
