# =========================================================================
# VitalDrop - application configuration
# =========================================================================

# --- Server --------------------------------------------------------------
# Vercel injects PORT in production; default 8080 keeps local dev unchanged.
server.port=${PORT:8080}
server.error.include-message=never

# --- Database (MySQL 8) --------------------------------------------------
# Local defaults: localhost:3306 / lifesaver (unchanged local behaviour).
# Production: set DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD
# (+ DB_USE_SSL=true on most cloud MySQL providers) as environment variables.
# Create local DB once with:
#   CREATE DATABASE lifesaver CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
#   CREATE USER 'lifelink'@'localhost' IDENTIFIED BY 'lifelink123';
#   GRANT ALL PRIVILEGES ON lifesaver.* TO 'lifelink'@'localhost';
#   FLUSH PRIVILEGES;
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:lifesaver}?useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:lifelink}
spring.datasource.password=${DB_PASSWORD:lifelink123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate -----------------------------------------------------
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

# --- Flyway (schema is versioned in src/main/resources/db/migration) -----
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# --- Multipart (profile photo upload) ------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- JWT -----------------------------------------------------------------
# Base64-encoded HS256 key (>= 32 bytes decoded).
# Local default keeps development working; production MUST set JWT_SECRET.
app.jwt.secret=${JWT_SECRET:dbiZrAqkpmd0oL5j9Kcuxc5IKyRe+sR2909PIPe06NaMU9XrfwPfDVuc66PT5mKX}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.remember-ms=${JWT_REMEMBER_MS:604800000}
app.jwt.issuer=${JWT_ISSUER:lifelink}

# --- Frontend / backend base URLs ----------------------------------------
# Used in emailed links (password reset) and CORS defaults.
# Local defaults keep development working; production MUST set FRONTEND_URL
# to the deployed Vercel frontend domain and BACKEND_URL to the deployed
# Vercel backend domain (used for email accept/decline links).
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.backend-url=${BACKEND_URL:http://localhost:8080}

# --- CORS ------------------------------------------------------------------
# Comma-separated list of allowed origins. Defaults keep local dev working
# (frontend on :3000, backend/mail-service on :8080/:3001).
# Production: set CORS_ALLOWED_ORIGINS to the deployed frontend domain,
# e.g. CORS_ALLOWED_ORIGINS=https://your-frontend.vercel.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://localhost:3001}

# --- Email ---------------------------------------------------------------
# Gmail SMTP via JavaMailSender - provide MAIL_USERNAME/MAIL_PASSWORD
# (Gmail App Password) as environment variables. No credentials are
# committed here; empty defaults mean mail config must come from env.
# Set APP_EMAIL_ENABLED=true and provide SMTP credentials to send real mail.
# When false, every email is written to the application log instead.
app.email.enabled=${APP_EMAIL_ENABLED:true}
app.email.from=VitalDrop <${MAIL_USERNAME:noreply@example.com}>

spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# --- SMS (donor mobile notification) ---------------------------------------
# Set APP_SMS_ENABLED=true to enable real SMS provider.
# When false, SMS is logged to application log (simulated) using donor's registered mobile.
app.sms.enabled=false
app.sms.from=VitalDrop

# --- Mail Service (Nodemailer) -------------------------------------------
# Optional Node mail-service delegation. Local default keeps existing
# behaviour; production without the Node service should set
# MAIL_SERVICE_ENABLED=false so JavaMailSender is used directly.
# Set MAIL_SERVICE_URL only if a reachable mail-service exists.
app.mail-service.enabled=${MAIL_SERVICE_ENABLED:true}
app.mail-service.url=${MAIL_SERVICE_URL:http://localhost:3001}

# --- App behaviour -------------------------------------------------------
# Maximum notification distance in km (Haversine). Override via APP_MAX_DISTANCE_KM.
app.max-distance-km=15

# --- Logging -------------------------------------------------------------
logging.level.root=INFO
logging.level.com.lifelink=INFO
logging.file.name=logs/lifelink.log
logging.file.max-size=10MB
logging.file.max-history=7
